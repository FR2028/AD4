<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-X // Local Control Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { background: #050505; color: #00ff66; padding: 30px; font-family: 'Share Tech Mono', monospace; }
        .panel { background: #0c0c0c; border: 1px solid #1f1f1f; padding: 20px; margin-bottom: 20px; }
        button { width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; margin-bottom: 10px; text-transform: uppercase; }
        .btn-danger { background: rgba(255, 51, 51, 0.2); color: #ff3333; border: 1px solid #ff3333; }
        .btn-success { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; }
        .log-box { background: #000; border: 1px solid #111; padding: 10px; height: 120px; overflow-y: auto; font-size: 0.85rem; color: #00ff66; }
    </style>
</head>
<body>
    <h2>// CYBER-X LOCAL COMMAND CONSOLE</h2>
    <div class="panel">
        <button class="btn-danger" onclick="sendAction('HIJACK')">⚡ 執行全網劫持 (Full Compromise)</button>
        <button class="btn-success" onclick="sendAction('RESTORE')">🛡️ 恢復系統正常 (Restore Node)</button>
    </div>
    <div class="panel">
        <div>[ Terminal Logs ]</div>
        <div class="log-box" id="log">Channel initialized...<br></div>
    </div>

    <script>
        // 建立一個名為 apex_channel 的廣播通道
        const channel = new BroadcastChannel('apex_channel');
        const logBox = document.getElementById('log');

        function sendAction(type) {
            channel.postMessage({ type: type });
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] Command broadcasted: ${type}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
