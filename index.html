<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMAND CENTER // Nexus Breach Utility</title>
    <style>
        body { background: #0a0a0a; color: #00ff66; font-family: 'Courier New', Courier, monospace; padding: 40px; }
        .panel { border: 1px solid #00ff66; padding: 25px; max-width: 600px; margin: auto; box-shadow: 0 0 15px rgba(0,255,102,0.2); }
        h1 { border-bottom: 1px solid #00ff66; padding-bottom: 10px; font-size: 1.5rem; }
        .btn { display: block; width: 100%; padding: 15px; margin: 15px 0; background: transparent; border: 1px solid #00ff66; color: #00ff66; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #00ff66; color: #000; }
        .status-log { margin-top: 20px; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>// SYSTEM ACCESS: ROOT</h1>
        <p>Target: NEXUS_BANK_CORE</p>
        
        <button class="btn" onclick="executeCommand('COMPROMISE')">EXECUTE: SYSTEM COMPROMISED</button>
        <button class="btn" onclick="executeCommand('RESTORE')">EXECUTE: RESTORE STABILITY</button>
        
        <div class="status-log" id="log">Status: Awaiting Command...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config (必須與 B 站完全一致)
        const firebaseConfig = {
            apiKey: "AIzaSyCoJIzAVmrty3GddH7X5s5gSeYnMuOsGRk",
            authDomain: "ad26-8b064.firebaseapp.com",
            databaseURL: "https://ad26-8b064-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ad26-8b064",
            storageBucket: "ad26-8b064.firebasestorage.app",
            messagingSenderId: "600044263940",
            appId: "1:600044263940:web:31825b3dec5a026fc6f351"
        };

        const db = getDatabase(initializeApp(firebaseConfig));

        window.executeCommand = function(cmd) {
            const log = document.getElementById('log');
            if (cmd === 'COMPROMISE') {
                set(ref(db, 'nexus_bank'), {
                    status: "SYSTEM_COMPROMISED",
                    deface_trigger: { active: true },
                    last_action: "ROOT_ACCESS_GRANTED"
                });
                log.innerText = "Status: Command [COMPROMISE] sent successfully.";
            } else {
                set(ref(db, 'nexus_bank'), {
                    status: "SECURE",
                    deface_trigger: { active: false },
                    last_action: "SYSTEM_RESTORED"
                });
                log.innerText = "Status: Command [RESTORE] sent successfully.";
            }
        };
    </script>
</body>
</html>
