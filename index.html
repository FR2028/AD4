<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBER-X // MASTER CONTROL CENTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body { background: #080808; color: #00ff66; padding: 30px; font-family: 'Share Tech Mono', monospace; }
        .header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .panel { background: #121212; border: 1px solid #333; padding: 20px; border-radius: 5px; }
        .panel-title { color: #aaa; margin-bottom: 15px; font-size: 0.9rem; text-transform: uppercase; }
        
        button { 
            width: 100%; padding: 15px; margin-bottom: 10px; cursor: pointer; 
            background: transparent; border: 1px solid #00ff66; color: #00ff66;
            font-family: inherit; font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #00ff66; color: #000; }
        
        .btn-danger { border-color: #ff3333; color: #ff3333; }
        .btn-danger:hover { background: #ff3333; color: #fff; }
        
        .log-box { 
            background: #000; padding: 15px; height: 300px; overflow-y: auto; 
            border: 1px solid #222; font-size: 0.85rem; color: #00ff66;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>// CYBER-X : MASTER CONTROL</h1>
        <p>Status: <span id="conn">LINK ESTABLISHED</span></p>
    </div>

    <div class="control-grid">
        <div class="panel">
            <div class="panel-title">[ PAYLOAD DEPLOYMENT ]</div>
            <button class="btn-danger" onclick="deploy('HIJACK')">⚡ FULL SYSTEM HIJACK</button>
            <button onclick="deploy('GLITCH_MODE')">💀 INJECT GLITCH EFFECT</button>
            <button onclick="deploy('TEXT_STORM')">💾 CORRUPT DATA STREAM</button>
            <button style="border-color: #fff; color: #fff;" onclick="deploy('RESTORE')">🛡️ SYSTEM RESTORE</button>
        </div>

        <div class="panel">
            <div class="panel-title">[ TERMINAL OUTPUT ]</div>
            <div class="log-box" id="log"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoJIzAVmrty3GddH7X5s5gSeYnMuOsGRk",
            authDomain: "ad26-8b064.firebaseapp.com",
            databaseURL: "https://ad26-8b064-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ad26-8b064",
            storageBucket: "ad26-8b064.firebasestorage.app",
            messagingSenderId: "600044263940",
            appId: "1:600044263940:web:31825b3dec5a026fc6f351",
            measurementId: "G-CVQVRX80K8"
        };
        const db = getDatabase(initializeApp(firebaseConfig));
        const logBox = document.getElementById('log');

        window.deploy = function(type) {
            set(ref(db, 'logistics/payload'), {
                type: type,
                timestamp: Date.now()
            });
            
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] >> DEPLOYING: ${type}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
