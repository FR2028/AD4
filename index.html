<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-X // Command & Control Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');
        :root { --bg: #050505; --panel: #111; --border: #00ff66; --accent: #00ff66; --text: #fff; --danger: #ff003c; --warn: #ffbd2e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body { background-color: var(--bg); color: var(--text); padding: 30px; }

        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: var(--accent); font-size: 2rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,255,102,0.4); }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 30px; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .card { background: var(--panel); border: 1px solid #222; border-top: 2px solid var(--accent); border-radius: 6px; padding: 20px; }
        .card h3 { font-size: 1.1rem; margin-bottom: 15px; color: var(--accent); }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid #333; color: var(--accent); padding: 10px; border-radius: 4px; font-size: 0.9rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; background: #1a1a1a; border: 1px solid var(--accent); color: var(--accent); padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        button:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0,255,102,0.4); }
        button.danger { border-color: var(--danger); color: var(--danger); }
        button.danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(255,0,60,0.4); }
        button.warn { border-color: var(--warn); color: var(--warn); }
        button.warn:hover { background: var(--warn); color: #000; box-shadow: 0 0 15px rgba(255,189,46,0.4); }

        .status-bar { margin-top: 20px; padding: 10px; background: #000; border: 1px solid #333; font-size: 0.85rem; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <h1>CYBER-X // C2 PANEL</h1>
        <p class="subtitle">Nexus Bank Remote Control System (Firebase Backend)</p>

        <div class="grid">
            <!-- 1. 終端機遠端指令控制 -->
            <div class="card" style="grid-column: span 2;">
                <h3>// TERMINAL REMOTE CONTROLLER</h3>
                <div class="form-group">
                    <label>Terminal Box Visibility</label>
                    <div class="btn-row">
                        <button onclick="setTerminal(true)">Open Terminal</button>
                        <button onclick="setTerminal(false)" class="danger">Close Terminal</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Command / Message Input</label>
                    <input type="text" id="term-msg" placeholder="e.g. Downloading database shards...">
                </div>
                <div class="form-group">
                    <label>Message Style / Type</label>
                    <select id="term-type">
                        <option value="">Normal (Green)</option>
                        <option value="info">Info (Cyan)</option>
                        <option value="warn">Warning (Yellow)</option>
                        <option value="error">Error / Danger (Red)</option>
                    </select>
                </div>
                <button onclick="sendTerminalMsg()">Send Terminal Log</button>
            </div>

            <!-- 2. 系統全面控制 -->
            <div class="card">
                <h3>// SYSTEM TAKEOVER</h3>
                <div class="btn-row" style="margin-bottom: 15px;">
                    <button class="danger" onclick="setDeface(true)">Trigger DEFACE</button>
                    <button onclick="setDeface(false)">Restore System</button>
                </div>
                <div class="btn-row">
                    <button class="warn" onclick="triggerShake()">Trigger Shake</button>
                </div>
            </div>

            <!-- 3. 財務核心篡改 -->
            <div class="card">
                <h3>// VAULT & FINANCIAL STATUS</h3>
                <div class="form-group">
                    <label>Vault Balance</label>
                    <input type="text" id="vault-balance" value="$0.00 (FROZEN)">
                </div>
                <div class="form-group">
                    <label>Status Text</label>
                    <input type="text" id="vault-status" value="SYSTEM COMPROMISED">
                </div>
                <button class="danger" onclick="updateFinancials()">Push Financial State</button>
            </div>

            <!-- 4. 警報與橫幅控制 -->
            <div class="card">
                <h3>// SECURITY ALERT BANNER</h3>
                <div class="form-group">
                    <label>Alert Message</label>
                    <input type="text" id="alert-text" value="CRITICAL: Unauthorized asset drain in progress!">
                </div>
                <div class="btn-row">
                    <button class="warn" onclick="setAlert(true)">Show Alert</button>
                    <button onclick="setAlert(false)">Hide Alert</button>
                </div>
            </div>

            <!-- 5. 聯絡資訊竄改 -->
            <div class="card">
                <h3>// METADATA CORRUPTION</h3>
                <div class="btn-row">
                    <button class="danger" onclick="setCorruptInfo(true)">Corrupt Contact Info</button>
                    <button onclick="setCorruptInfo(false)">Restore Contact Info</button>
                </div>
            </div>
        </div>

        <div class="status-bar" id="status-log">Status: Ready. Connected to Firebase DB.</div>
    </div>

    <!-- Firebase 控制端邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoJIzAVmrty3GddH7X5s5gSeYnMuOsGRk",
            authDomain: "ad26-8b064.firebaseapp.com",
            databaseURL: "https://ad26-8b064-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ad26-8b064",
            storageBucket: "ad26-8b064.firebasestorage.app",
            messagingSenderId: "600044263940",
            appId: "1:600044263940:web:31825b3dec5a026fc6f351"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        const dbRef = ref(db, 'nexus_bank_control');
        const logBar = document.getElementById('status-log');

        function pushCommand(data) {
            update(dbRef, data).then(() => {
                logBar.innerText = `Status: Command executed successfully at ${new Date().toLocaleTimeString()}`;
            }).catch((error) => {
                logBar.innerText = `Status Error: ${error.message}`;
            });
        }

        // 全域控制函數綁定
        window.setTerminal = function(show) {
            pushCommand({ terminal: show });
        }

        window.sendTerminalMsg = function() {
            const msg = document.getElementById('term-msg').value;
            const type = document.getElementById('term-type').value;
            if (!msg) return;
            pushCommand({ terminal: true, terminal_msg: msg, terminal_type: type });
            document.getElementById('term-msg').value = '';
        }

        window.setDeface = function(active) {
            pushCommand({ deface: active, terminal: active, terminal_msg: active ? "SECURITY OVERRIDE: Core seized." : "System restored to normal state.", terminal_type: active ? "error" : "" });
        }

        window.triggerShake = function() {
            pushCommand({ shake: true, terminal_msg: "WARNING: High seismic activity / kernel panic triggered!", terminal_type: "warn" });
            setTimeout(() => pushCommand({ shake: false }), 500);
        }

        window.updateFinancials = function() {
            const balance = document.getElementById('vault-balance').value;
            const status = document.getElementById('vault-status').value;
            pushCommand({ balance: balance, status: status, terminal_msg: `Vault state updated -> Balance: ${balance}`, terminal_type: "info" });
        }

        window.setAlert = function(show) {
            const msg = document.getElementById('alert-text').value;
            pushCommand({ alert: show, alert_msg: msg, terminal_msg: show ? `Alert banner broadcasted: ${msg}` : "Alert banner cleared.", terminal_type: show ? "warn" : "" });
        }

        window.setCorruptInfo = function(corrupt) {
            pushCommand({ corrupt_info: corrupt, terminal_msg: corrupt ? "Database metadata compromised & replaced." : "Metadata restored.", terminal_type: corrupt ? "error" : "info" });
        }
    </script>
</body>
</html>
